# SPDX-License-Identifier: GPL-2.0-or-later
name: ci

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

jobs:
  # An unparseable workflow shows up as a failed run with zero jobs and no
  # log to read, which is a miserable way to find a stray indentation. This
  # says what is wrong instead.
  workflows:
    name: Workflow syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every workflow
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = 0
          for f in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  jobs = yaml.safe_load(f.read_text()).get("jobs", {})
                  print(f"ok    {f}  jobs: {', '.join(jobs)}")
              except Exception as e:
                  print(f"FAIL  {f}\n{e}")
                  bad = 1
          sys.exit(bad)
          PY

  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: windows-latest
            compiler: msvc
          - os: macos-latest
            compiler: clang

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            export CC=clang
          elif [ "${{ matrix.compiler }}" = "gcc" ]; then
            export CC=gcc
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      # Each path is checked against its own budget: one number cannot
      # describe both an accumulator that touches a frame once and a kernel
      # that re-sums N taps per output frame. Budgets carry roughly 2x
      # headroom over the slowest runner, so this catches an algorithmic
      # regression rather than the timing noise of a shared machine.
      - name: Benchmark
        shell: bash
        run: |
          BENCH=$(find build \( -name 'mblur_bench' -o -name 'mblur_bench.exe' \) -type f | head -1)
          if [ -z "$BENCH" ]; then echo "benchmark binary not found"; exit 1; fi
          "$BENCH" --resolution 1080p --check-budgets

  obs-plugin-linux:
    name: OBS plugin (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 24.04 ships libobs-dev 30.0.2, which is exactly the OBS 30.0
      # floor the plugin targets, with working CMake package configs for both
      # libobs and obs-frontend-api. No PPA needed - and obs-studio must NOT
      # be installed alongside, because it conflicts with libobs0.
      - name: Install libobs
        run: |
          sudo apt-get update
          sudo apt-get install -y libobs-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DMBLUR_BUILD_OBS_PLUGIN=ON
          cmake --build build

      # test_obs_module dlopens the built module with RTLD_NOW and resolves
      # OBS's three entry points. That catches a call to a libobs function
      # that does not exist in the targeted version - which links fine and
      # then fails to load inside OBS with only a LOG_DEBUG line to show for
      # it.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: motion-blur-plugin-linux
          path: build/obs-plugin/motion-blur.so

  obs-plugin-windows:
    name: OBS plugin (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Assembles an SDK from OBS's own shipped DLLs plus matching headers,
      # rather than building OBS (and Qt, and obs-deps) from source.
      - name: Assemble the OBS SDK
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/make-obs-sdk.ps1 -OutDir obs-sdk

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release `
                -DMBLUR_BUILD_OBS_PLUGIN=ON `
                -DOBS_SDK_DIR="${{ github.workspace }}/obs-sdk"
          cmake --build build --config Release

      - name: Check the module
        shell: pwsh
        run: ./.github/scripts/check-obs-module.ps1 -BuildDir build

      - uses: actions/upload-artifact@v4
        with:
          name: motion-blur-plugin-windows
          path: build/obs-plugin/Release/motion-blur.dll
