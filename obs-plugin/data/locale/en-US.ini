MotionBlur="Motion Blur"

Mode="Mode"
Mode.Decimate="Decimate (true shutter, needs a faster canvas)"
Mode.Rolling="Rolling blend (works anywhere)"
Mode.Description="Decimate blends each group of N canvas frames into one encoded frame - a real shutter integral, but only if the canvas runs above your recording frame rate. Rolling blend averages the last N frames at the same rate: it needs no setup, but it is a trailing smear rather than a true exposure."

Frames="Blur length"
Frames.Suffix=" frames"
Frames.Description="How many canvas frames go into one blurred frame. In decimate mode this is also the ratio between the canvas frame rate and the recorded one: 4 means a 240 fps canvas records at 60 fps."

Weighting="Weighting"
CustomWeights="Custom weights"

Amount="Shutter angle"
Amount.Description="Fraction of the window that is exposed. 1.0 integrates the whole window. Below 1.0 the outer frames are dropped, giving a crisper, more strobed look. Above 1.0 the curve flattens towards equal weighting, which is deliberate ghosting."

GaussStd="Gaussian: standard deviation"
GaussMean="Gaussian: centre"
GaussBound="Gaussian: extent"

PhaseOffset="Phase offset"

DriveDivisor="Set the recording frame rate divisor automatically"
DriveDivisor.Description="When recording starts, divide the recording encoder's frame rate by the blur length, so a 240 fps canvas records at 60 fps. Only one filter can drive this. Requires the canvas frame rate to be set to N times your intended recording rate, and the captured application to actually present that fast."
